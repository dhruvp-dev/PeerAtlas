<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Deep Navy Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091325" />
      <stop offset="50%" stop-color="#0e1f3b" />
      <stop offset="100%" stop-color="#060d1a" />
    </linearGradient>

    <!-- Sky Blue Radial Glow -->
    <radialGradient id="radial-glow" cx="85%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#4a9fd4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#4a9fd4" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Dot Grid Pattern representing digital archives -->
    <pattern id="dot-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.2" fill="#ffffff" fill-opacity="0.08" />
    </pattern>

    <!-- Soft Horizontal Divider Gradient -->
    <linearGradient id="divider-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a9fd4" stop-opacity="0" />
      <stop offset="15%" stop-color="#4a9fd4" stop-opacity="0.4" />
      <stop offset="85%" stop-color="#4a9fd4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#4a9fd4" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />
  <rect width="1200" height="630" fill="url(#radial-glow)" />
  <rect width="1200" height="630" fill="url(#dot-grid)" />

  <!-- Subtle abstract geometry (Academic/Data nodes) -->
  <g opacity="0.18" transform="translate(50, 0)">
    <circle cx="950" cy="180" r="200" fill="none" stroke="#4a9fd4" stroke-width="1.2" stroke-dasharray="10 15" />
    <circle cx="950" cy="180" r="110" fill="none" stroke="#4a9fd4" stroke-width="1.8" />
    <line x1="700" y1="180" x2="1200" y2="180" stroke="#4a9fd4" stroke-width="1" />
    <line x1="950" y1="-50" x2="950" y2="400" stroke="#4a9fd4" stroke-width="1" />
  </g>

  <!-- Content Group (Perfect alignment matching standard layouts) -->
  <g transform="translate(100, 0)">
    
    <!-- Stylized Brand Icon (P + A vector combination matching logo files) -->
    <g transform="translate(0, 150)">
      <!-- Main Outer Shield / Folder Shape -->
      <path d="M0,0 H64 V32 H16 V64 H0 Z" fill="#ffffff" />
      <!-- Sky Blue Highlight Accent inside -->
      <path d="M28,16 L36,8 L44,16 Z" fill="#4a9fd4" />
    </g>

    <!-- Typography Section -->
    <!-- Brand Title -->
    <text x="88" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
      Peer<tspan fill="#4a9fd4" font-weight="500">Atlas</tspan>
    </text>

    <!-- Primary Title (Stress-free academic message) -->
    <text x="0" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff" letter-spacing="-0.8" opacity="0.95">
      Finding engineering papers shouldn't feel like a treasure hunt.
    </text>

    <!-- Subtext -->
    <text x="0" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#dbe4ec" opacity="0.7">
      The calm, search-first previous year question papers archive for Bharati Vidyapeeth Deemed University.
    </text>

    <!-- Soft divider line -->
    <rect x="0" y="420" width="1000" height="1.5" fill="url(#divider-grad)" />

    <!-- Features / Bullet points footer -->
    <g transform="translate(0, 475)">
      <!-- Item 1: Search Speed -->
      <g transform="translate(0, 0)">
        <circle cx="10" cy="10" r="5" fill="#4a9fd4" />
        <text x="28" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="0.8">SEARCH IN &lt; 5 SECONDS</text>
      </g>

      <!-- Item 2: Organised Structure -->
      <g transform="translate(320, 0)">
        <circle cx="10" cy="10" r="5" fill="#4a9fd4" />
        <text x="28" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="0.8">BY SEMESTER &amp; BRANCH</text>
      </g>

      <!-- Item 3: Ad-free / Stress-free -->
      <g transform="translate(650, 0)">
        <circle cx="10" cy="10" r="5" fill="#4a9fd4" />
        <text x="28" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="0.8">100% AD-FREE &amp; CALM</text>
      </g>
    </g>

  </g>
</svg>
